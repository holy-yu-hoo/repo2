{% load static %}
<!doctype html>
<html lang = "en">
<head>
	{% block meta %}
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<meta http-equiv = "X-UA-Compatible" content = "ie=edge">
	{% endblock meta %}
	<link rel = "stylesheet" href = "{% static 'app/css/base_style.css' %}" type = "text/css">
	{% block link %}
	{% endblock link %}
	<title>{% block title %}Document{% endblock %}</title>
</head>
<body>
{% block body %}
{% endblock body %}
</body>
</html>
